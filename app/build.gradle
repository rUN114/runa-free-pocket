plugins { id 'com.android.application' }
android {
    namespace 'cn.run.freepocket'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.run.freepocket'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    // Origin-restricted messaging and scripts inside Epic's cross-origin checkout frame.
    implementation 'androidx.webkit:webkit:1.12.1'
}
