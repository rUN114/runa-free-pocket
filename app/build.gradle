plugins { id 'com.android.application' }
def signingPropertiesPath = providers.gradleProperty('runaSigningProperties').orNull
def releaseSigning = new Properties()
if (signingPropertiesPath != null) {
    file(signingPropertiesPath).withInputStream { releaseSigning.load(it) }
}
android {
    namespace 'cn.run.freepocket'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.run.freepocket'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '1.0.0'
        testInstrumentationRunner 'cn.run.freepocket.tests.ReleaseVerification'
    }
    testBuildType providers.gradleProperty('runaTestBuildType').getOrElse('release')
    signingConfigs {
        if (signingPropertiesPath != null) {
            runaRelease {
                storeFile file(releaseSigning.getProperty('storeFile'))
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            if (signingPropertiesPath != null) signingConfig signingConfigs.runaRelease
            minifyEnabled true
            shrinkResources true
            // WebKit supplies its Chromium boundary-interface keep rules in the AAR.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
        compact {
            initWith release
            debuggable true
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    // Origin-restricted messaging and scripts inside Epic's cross-origin checkout frame.
    implementation 'androidx.webkit:webkit:1.12.1'
    // The Android SDK's JSON classes are stubs in local JVM tests; execute the real parser instead.
    testImplementation 'org.json:json:20240303'
    testImplementation 'junit:junit:4.13.2'
}
