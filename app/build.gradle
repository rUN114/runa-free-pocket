plugins { id 'com.android.application' }
android {
    namespace 'cn.run.freepocket'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.run.freepocket'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.4.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    // Origin-restricted messaging and scripts inside Epic's cross-origin checkout frame.
    implementation 'androidx.webkit:webkit:1.12.1'
    // The Android SDK's JSON classes are stubs in local JVM tests; execute the real parser instead.
    testImplementation 'org.json:json:20240303'
    testImplementation 'junit:junit:4.13.2'
}
