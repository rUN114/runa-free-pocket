name: tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly upstream shape probe (Monday 21:00 UTC). Offline fixtures cannot notice
    # when Epic/Fab change their live responses; this read-only check can.
    - cron: '0 21 * * 1'

jobs:
  js-and-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: JavaScript adapter tests
        run: node --test tests/automation.test.cjs tests/domain.test.cjs tests/fab-tier.test.cjs tests/shared-fixture.test.cjs
      - name: JVM unit tests (release variant)
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest --console=plain

  upstream-shape-probe:
    runs-on: ubuntu-latest
    needs: js-and-jvm
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Read-only upstream shape probe
        run: python3 tests/upstream/probe.py
