name: tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js-and-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: JavaScript adapter tests
        run: node --test tests/*.test.cjs
      - name: Offline Python regression tests
        run: |
          python3 -m unittest discover -s tests/upstream -p 'test_*.py'
          python3 -m unittest discover -s tests/device -p 'test_*.py'
      - name: JVM tests, Lint and release build
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest lintRelease assembleRelease --console=plain
